services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dac
      POSTGRES_PASSWORD: dac123
      POSTGRES_DB: dac2pc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dac -d dac2pc"]
      interval: 2s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 2s
      timeout: 3s
      retries: 20